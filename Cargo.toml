[package]
name = "qinv-be-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
sea-query = { version = "1.0.2", features = ["backend-postgres"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
